<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reelo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reelo">
<meta name="theme-color" content="#0d0b14">
<style>
:root{--bg:#0d0b14;--ink:#f6f1ff;--hot:#ff5a36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-family:-apple-system,"SF Pro Rounded","Helvetica Neue",sans-serif}
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.s{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.s video{width:100%;height:100%;object-fit:contain;background:#000}
.pp{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;font-size:34px;pointer-events:none}
.s.paused .pp{display:flex}
.msg{flex-direction:column;text-align:center;padding:32px;background:radial-gradient(circle at 50% 30%,#2a2160,var(--bg) 70%)}
.msg h2{font-size:28px;margin:8px 0}.msg p{margin:0;opacity:.7;max-width:280px;line-height:1.4}
#menu{position:fixed;z-index:5;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:12px}
#opts{display:none;flex-direction:column;gap:12px}
#menu.open #opts{display:flex}
.fab{border:0;color:#fff;font-size:26px;width:52px;height:52px;border-radius:50%;background:rgba(20,18,32,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#dots{font-size:30px;line-height:1;padding-bottom:6px}
#add{background:var(--hot);font-size:32px;line-height:1}
#snd{font-size:22px}
#toast{position:fixed;z-index:6;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--ink);color:#111;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;transition:transform .3s;max-width:80%;text-align:center;min-width:170px}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="feed"></div>
<div id="menu">
  <button class="fab" id="dots" aria-label="Menu">⋯</button>
  <div id="opts">
    <button class="fab" id="snd" aria-label="Sound">🔊</button>
    <button class="fab" id="add" aria-label="Upload video">+</button>
  </div>
</div>
<input type="file" id="file" accept="video/*" hidden>
<div id="toast"></div>

<script>
/* ===== SETTINGS (GitHub Pages / any host) =====
   Paste your Supabase Project URL and anon public key here.
   Example: const CFG = { url: "https://abcd.supabase.co", key: "eyJhbGciOi...", bucket: "videos" };
   Leave empty only if you run the home server (start.bat), which shares videos by itself. */
const CFG = { url: "https://zyvidhjpslpgtkdvosya.supabase.co", key: "sb_publishable_2GIV2Wr_RrzQBwKU-x_lnA_bs_We8Nn", bucket: "videos" };

/* ===== App icon + manifest ===== */
function icon(n){
  const c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,n,n);g.addColorStop(0,"#ff5a36");g.addColorStop(1,"#5b3cff");
  x.fillStyle=g;x.fillRect(0,0,n,n);
  x.fillStyle="rgba(255,255,255,.18)";x.beginPath();x.arc(n*.5,n*.5,n*.34,0,7);x.fill();
  x.fillStyle="#fff";x.beginPath();x.moveTo(n*.43,n*.34);x.lineTo(n*.43,n*.66);x.lineTo(n*.69,n*.5);x.closePath();x.fill();
  return c.toDataURL("image/png");
}
(function(){
  const a=document.createElement("link");a.rel="apple-touch-icon";a.href=icon(180);document.head.appendChild(a);
  const m={name:"Reelo",short_name:"Reelo",display:"standalone",background_color:"#0d0b14",theme_color:"#0d0b14",
    start_url:location.href.split("#")[0],icons:[{src:icon(512),sizes:"512x512",type:"image/png"}]};
  const l=document.createElement("link");l.rel="manifest";
  l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));
  document.head.appendChild(l);
})();

/* ===== No zoom ===== */
["gesturestart","gesturechange","gestureend"].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
let lt=0;document.addEventListener("touchend",e=>{const t=Date.now();if(t-lt<350)e.preventDefault();lt=t},{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

/* ===== Shared storage: Supabase (GitHub) or home server ===== */
const remote=!!(CFG.url&&CFG.key);
const isJwt=CFG.key.startsWith("eyJ");   // new sb_publishable keys are not JWTs: send as apikey only
const H=isJwt?{apikey:CFG.key,Authorization:"Bearer "+CFG.key}:{apikey:CFG.key};
const api={
  async list(){
    if(remote){
      const r=await fetch(`${CFG.url}/storage/v1/object/list/${CFG.bucket}`,{method:"POST",
        headers:{...H,"Content-Type":"application/json"},
        body:JSON.stringify({prefix:"",limit:200,sortBy:{column:"created_at",order:"desc"}})});
      if(!r.ok){let t="";try{t=(await r.text()).slice(0,120)}catch(e){}throw new Error("HTTP "+r.status+" "+t)}
      return (await r.json()).filter(o=>o.name&&o.id).map(o=>({id:o.name,
        src:`${CFG.url}/storage/v1/object/public/${CFG.bucket}/${encodeURIComponent(o.name)}`}));
    }
    const r=await fetch("/api/list",{cache:"no-store"});
    if(!r.ok||!(r.headers.get("content-type")||"").includes("json"))throw new Error("no server");
    return r.json();
  },
  upload(file,onProgress){
    const ext=(file.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")||"mp4";
    const id=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
    return new Promise((res,rej)=>{
      const x=new XMLHttpRequest();
      if(remote){
        x.open("POST",`${CFG.url}/storage/v1/object/${CFG.bucket}/${id}`);
        x.setRequestHeader("apikey",CFG.key);
        if(isJwt)x.setRequestHeader("Authorization","Bearer "+CFG.key);
      }else x.open("POST","/api/upload?ext="+ext);
      x.setRequestHeader("Content-Type",file.type||"video/mp4");
      x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(Math.min(99,Math.round(e.loaded/e.total*100)))};
      x.onload=()=>{
        if(x.status<200||x.status>=300)return rej(new Error("upload failed"));
        onProgress(100);
        let rid=id;if(!remote){try{rid=JSON.parse(x.responseText).id}catch(e){}}
        res(rid);
      };
      x.onerror=()=>rej(new Error("network"));
      x.send(file);
    });
  }
};

/* ===== Feed (endless loop, no "all caught up" screen) ===== */
const feed=document.getElementById("feed"), toastEl=document.getElementById("toast");
const known=new Map();            // id -> {id,src}, newest first
const store={
  get(){try{const a=JSON.parse(localStorage.getItem("watched")||"[]");return Array.isArray(a)?a:[]}catch(e){return []}},
  set(a){try{localStorage.setItem("watched",JSON.stringify(a))}catch(e){}}
};
const watched=new Set(store.get());
let muted=false, needUnmute=false, skipClick=false, cur=null, ready=false, quietUntil=0;
const progress=(p,label)=>{
  toastEl.textContent=label||("Uploading "+p+"/100%");
  toastEl.classList.add("on");
  clearTimeout(toast.t);
  toastEl.style.background=`linear-gradient(90deg,#ff8a6b ${p}%,#f6f1ff ${p}%)`;
};
const toast=(t,ms=2500)=>{toastEl.style.background="";toastEl.textContent=t;toastEl.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove("on"),ms)};

const io=new IntersectionObserver(es=>es.forEach(e=>{
  const s=e.target,v=s.querySelector("video");
  if(e.isIntersecting){
    cur=s;
    if(!v.src)v.src=s.dataset.src;
    v.muted=muted;s.classList.remove("paused");
    // browsers may block sound before the first tap: fall back to muted, unmute on first touch
    v.play().catch(()=>{ if(!muted){v.muted=true;needUnmute=true;document.getElementById("snd").textContent="🔇";v.play().catch(()=>{})} });
    s._w=setTimeout(()=>{watched.add(s.dataset.id);store.set([...watched])},1500);
    // last video of the list: add the list again so scrolling never ends
    if(s.dataset.last&&!s.dataset.done&&known.size){s.dataset.done=1;round()}
  }else{
    clearTimeout(s._w);
    if(v){v.pause();v.currentTime=0}
  }
}),{threshold:.6});

function slide(v){
  const s=document.createElement("section");s.className="s";s.dataset.id=v.id;s.dataset.src=v.src;
  s.innerHTML='<video playsinline webkit-playsinline loop preload="metadata" muted></video><div class="pp">▶</div>';
  const vid=s.querySelector("video");
  s.addEventListener("click",()=>{
    if(skipClick){skipClick=false;return}
    const m=document.getElementById("menu");if(m.classList.contains("open")){m.classList.remove("open");return}
    if(vid.paused){vid.play();s.classList.remove("paused")}else{vid.pause();s.classList.add("paused")} });
  io.observe(s);return s;
}
function round(){
  const list=[...known.values()];
  list.forEach((v,i)=>{const s=slide(v);if(i===list.length-1)s.dataset.last=1;feed.appendChild(s)});
}
function showMsg(icon,title,text){
  feed.innerHTML=`<section class="s msg"><div style="font-size:54px">${icon}</div><h2>${title}</h2><p>${text}</p></section>`;
}
const showEmpty=()=>showMsg("🎬","No videos yet","Tap + to upload the first one.");
function sync(list){
  const fresh=list.filter(v=>!known.has(v.id)).reverse();
  fresh.forEach(v=>{ const old=[...known]; known.clear(); known.set(v.id,v); old.forEach(([k,x])=>known.set(k,x));
    if(feed.querySelector(".msg")){feed.innerHTML="";return}
    const s=slide(v);(cur&&cur.nextSibling)?feed.insertBefore(s,cur.nextSibling):feed.appendChild(s); });
  if(!feed.children.length&&known.size)round();
  return fresh.length;
}
async function refresh(first){
  if(!first&&!ready)return;
  try{
    const list=await api.list();
    if(first){
      list.forEach(v=>known.set(v.id,v));
      const u=[...known.values()].sort((a,b)=>watched.has(a.id)-watched.has(b.id));   // unwatched first
      known.clear();u.forEach(v=>known.set(v.id,v));
      known.size?round():showEmpty();
      ready=true;
    }else{
      const n=sync(list);
      if(n&&Date.now()>quietUntil)toast(n===1?"New video is next ↓":n+" new videos are next ↓");
    }
  }catch(e){
    if(first)showMsg("⚙️","Not connected [v4]",remote?"Supabase said: "+(e&&e.message||e)+" — check URL, key, public bucket.":"Add your Supabase URL and key in index.html (CFG), or open this page from the home server.");
  }
}
refresh(true);
setInterval(()=>refresh(false),3000);                      // new videos from other devices
document.addEventListener("visibilitychange",()=>{ if(!document.hidden)refresh(false) });

/* ===== Controls ===== */
const snd=document.getElementById("snd"), menuEl=document.getElementById("menu");
function setMuted(m){
  muted=m;snd.textContent=muted?"🔇":"🔊";
  const v=cur&&cur.querySelector("video");if(v){v.muted=muted;v.play().catch(()=>{})}
}
// first touch anywhere turns the sound on if the browser blocked it at start
document.addEventListener("pointerdown",e=>{
  if(!needUnmute||e.target.closest("#snd"))return;
  needUnmute=false;skipClick=!e.target.closest("#menu");setTimeout(()=>{skipClick=false},500);
  setMuted(false);
},true);
snd.onclick=()=>{ if(needUnmute){needUnmute=false;setMuted(false)}else setMuted(!muted) };
document.getElementById("dots").onclick=()=>menuEl.classList.toggle("open");

/* ===== Shrink video on the phone before upload: pick up to 45 MB, upload about 10 MB ===== */
const MAX_IN=45*1024*1024, TARGET=10*1024*1024;
function pickMime(){
  if(!window.MediaRecorder)return "";
  return ["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"]
    .find(t=>MediaRecorder.isTypeSupported(t))||"";
}
async function compress(file,onP){
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error("unsupported");
  const url=URL.createObjectURL(file);
  const v=document.createElement("video");
  v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";
  v.style.cssText="position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none";
  document.body.appendChild(v);
  let ac=null,raf=0,rec=null;
  const cleanup=()=>{cancelAnimationFrame(raf);try{v.pause()}catch(e){}v.remove();URL.revokeObjectURL(url);try{ac&&ac.close()}catch(e){}};
  try{
    v.src=url;
    await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(new Error("decode"))});
    const dur=v.duration;
    if(!isFinite(dur)||dur<=0||!v.videoWidth)throw new Error("meta");
    const sc=Math.min(1,720/Math.min(v.videoWidth,v.videoHeight));
    const w=Math.max(2,Math.round(v.videoWidth*sc/2)*2), h=Math.max(2,Math.round(v.videoHeight*sc/2)*2);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;
    const cx=cv.getContext("2d");
    const abr=64000;
    const vbr=Math.max(250000,Math.min(4000000,Math.floor(TARGET*8*0.85/dur-abr)));   // aim for about 10 MB total
    const stream=cv.captureStream(30);
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      const src=ac.createMediaElementSource(v), dst=ac.createMediaStreamDestination();
      src.connect(dst);dst.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
      if(ac.state==="suspended")ac.resume();
    }catch(e){}
    const mime=pickMime();
    rec=new MediaRecorder(stream,Object.assign({videoBitsPerSecond:vbr,audioBitsPerSecond:abr},mime?{mimeType:mime}:{}));
    const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const stopped=new Promise(r=>{rec.onstop=r});
    const draw=()=>{cx.drawImage(v,0,0,w,h);onP(Math.min(99,Math.round(v.currentTime/dur*100)));raf=requestAnimationFrame(draw)};
    try{await v.play()}catch(e){v.muted=true;await v.play()}
    rec.start(500);draw();
    // wait for the end of the video; do not rely on the "ended" event alone (iOS can skip it)
    let stalled=false;
    await new Promise(res=>{
      let last=-1,lastT=Date.now();
      const iv=setInterval(()=>{
        const t=v.currentTime;
        if(v.ended||t>=dur-0.2){clearInterval(iv);res();return}
        if(v.paused)v.play().catch(()=>{});
        if(t!==last){last=t;lastT=Date.now()}
        else if(Date.now()-lastT>8000){clearInterval(iv);if(t<dur-1.5)stalled=true;res()}
      },250);
      v.onended=()=>{clearInterval(iv);res()};
    });
    if(stalled)throw new Error("stalled");
    cancelAnimationFrame(raf);
    try{rec.requestData()}catch(e){}
    if(rec.state!=="inactive")rec.stop();
    await Promise.race([stopped,new Promise(r=>setTimeout(r,4000))]);   // never wait forever for the recorder
    const type=(rec.mimeType||mime||"video/mp4").split(";")[0];
    const blob=new Blob(chunks,{type});
    if(!blob.size||blob.size>=file.size)return file;       // not smaller: keep original
    return new File([blob],"v."+(type.includes("mp4")?"mp4":"webm"),{type});
  }finally{cleanup()}
}

const fileIn=document.getElementById("file");
document.getElementById("add").onclick=()=>{menuEl.classList.remove("open");fileIn.click()};
fileIn.onchange=async()=>{
  const f=fileIn.files[0];fileIn.value="";if(!f)return;
  if(f.size>MAX_IN){toast("Too big: "+Math.round(f.size/1048576)+" MB. Max is 45 MB.",4000);return}
  quietUntil=Date.now()+900000;
  let up=f;
  if(f.size>TARGET){
    try{progress(0,"Shrinking video… 0%");up=await compress(f,p=>progress(p,"Shrinking video… "+p+"%"))}
    catch(e){up=f}      // could not shrink: upload the original (it is under 50 MB)
  }
  progress(0);
  try{
    const id=await api.upload(up,progress);
    progress(100,"Processing…");
    watched.add(id);
    if(!ready){ready=true}
    await refresh(false);
    const s=feed.querySelector('[data-id="'+id+'"]');
    if(s)s.scrollIntoView({behavior:"smooth"});
    quietUntil=Date.now()+3000;
    toast("Uploaded 100/100% ✓");
  }catch(e){quietUntil=0;toast("Upload failed. Check connection / file size (max 50 MB on free Supabase).")}
};
</script>
</body>
</html>
